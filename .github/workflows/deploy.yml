name: 🚀 Deploy Static Website to Hostinger via FTP

on:
  push:
    branches:
      - main  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: 📦 Deploy via SFTP
      uses: pressidium/lftp-deploy-action@v1.0.2
      with:
        host: ${{ secrets.FTP_HOST }}          # Ej: ftp.tusitio.com
        port: 65002                            # Tu puerto SFTP personalizado
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        sftp: true                             # Clave para usar SFTP
        localDir: ./                     # Cambialo si tu contenido está en otro lugar
        remoteDir: /public_html/               # Ruta de destino en tu Hostinger

